
name: Retention Recovery Test

on:
  workflow_dispatch:

jobs:
  recovery-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run recovery simulation
        run: python retention_recovery_test.py
