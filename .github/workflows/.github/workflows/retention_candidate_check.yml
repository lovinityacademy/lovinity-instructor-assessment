name: LOVINITY Retention Candidate Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RETENTION_DELETE_ENABLED: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'supabase>=2,<3'
      - run: python retention_worker_candidate.py
      - run: python retention_cleanup.py
